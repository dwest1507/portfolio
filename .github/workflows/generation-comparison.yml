name: Generation comparison

# Answers the golden question set on `dev` and `holdout` with every Candidate Arm (never a
# Reference Arm), judges the answers, and compares each Arm with the Shipped Arm by
# ADR-0006's test. It is the evidence the Shipped Arm decision rests on (ADR-0009).
#
# The decision is made on `dev`: those results are in the uploaded artifact and the job
# log, and are never published. A run dispatched on main publishes the held-out results as
# the Comparison section of frontend/data/generationResults.json, with its own provenance.
#
# Every run calls paid APIs (OpenAI and TypeSafe's Jev) for each Candidate Arm, about four
# generation gate runs' worth, so it runs only when dispatched by hand.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Kept in step with backend-ci.yml; see the note there.
  UV_VERSION: "0.12.23"

concurrency:
  group: generation-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Compare Candidate Arms
    runs-on: ubuntu-latest
    # Each Arm's cases are answered and judged eight at a time (eval/compare_arms.py's
    # --workers default): four Arms, each about a generation gate run (~2.5 minutes), plus
    # the ONNX models' first download. The rest is headroom for Jev's retries.
    timeout-minutes: 30
    steps:
      # The job token stays read-only and out of .git/config: publishing pushes as the
      # eval-publisher App instead (.github/actions/publish-results).
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # The default groups include dev, which carries ONNX Runtime for the Candidate Arms.
      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      # The ONNX Arms download their models on first use. Same cache as backend-ci.yml's
      # retrieval eval, so a run after one on the same lockfile downloads nothing.
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: hf-${{ runner.os }}-

      # CI's own keys, separate from production's (ADR-0008), as for the generation gate.
      - name: Comparison run
        env:
          OPENAI_CI_API_KEY: ${{ secrets.OPENAI_CI_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_CI_API_KEY }}
          PUBLISH_EVAL: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
          COMPARISON_RUN_OUTPUT: ${{ runner.temp }}/comparison-run.json
        run: ./scripts/backend-generation-comparison.sh

      # Every Arm's answers, judgments and won/lost on both splits: the `dev` results the
      # Shipped Arm decision is made on.
      - name: Upload the judged runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparison-run
          path: ${{ runner.temp }}/comparison-run.json
          if-no-files-found: ignore

      # The commit touches only frontend/data/generationResults.json. The generation gate
      # does not watch that path, so publishing cannot trigger a paid run.
      - name: Publish measured results
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-results
        with:
          paths: frontend/data/generationResults.json
          message: "chore(eval): publish generation comparison for"
          body: Generated by the Generation comparison job. See docs/adr/0009-shipped-arm-selection-rule.md.
          client-id: ${{ vars.EVAL_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.EVAL_PUBLISHER_PRIVATE_KEY }}
