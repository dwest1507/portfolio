name: Backend CI

# All check logic lives in scripts/ (shared with `make ci-cd`); jobs here only
# provision the environment and run the scripts. The retrieval eval runs from
# retrieval-eval.yml, on a narrower path filter.

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/resume.txt'
      - 'docs/chatbot-questions.md'
      - 'frontend/content/projects/**'
      - 'scripts/backend-*.sh'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/resume.txt'
      - 'docs/chatbot-questions.md'
      - 'frontend/content/projects/**'
      - 'scripts/backend-*.sh'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so CI writes and checks the same uv.lock revision as local development; an
  # unpinned uv can disagree on the lockfile format and fail `uv lock --check` on that
  # alone. Bump it together with the uv that last wrote backend/uv.lock.
  UV_VERSION: "0.12.23"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Lint checks
        run: ./scripts/backend-lint.sh

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Tests
        run: ./scripts/backend-test.sh
