name: Backend CI

# All check logic lives in scripts/ (shared with `make ci-cd`); jobs here only
# provision the environment and run the scripts.

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/resume.txt'
      - 'docs/chatbot-questions.md'
      - 'frontend/content/projects/**'
      - 'scripts/backend-*.sh'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/resume.txt'
      - 'docs/chatbot-questions.md'
      - 'frontend/content/projects/**'
      - 'scripts/backend-*.sh'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so CI writes and checks the same uv.lock revision as local development; an
  # unpinned uv can disagree on the lockfile format and fail `uv lock --check` on that
  # alone. Bump it together with the uv that last wrote backend/uv.lock.
  UV_VERSION: "0.12.23"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Lint checks
        run: ./scripts/backend-lint.sh

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Tests
        run: ./scripts/backend-test.sh

  eval:
    name: Retrieval eval
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The job token stays read-only and out of .git/config: publishing pushes as the
      # eval-publisher App instead (.github/actions/publish-results).
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      # The ONNX embedding + cross-encoder weights. Cache them so only the first run on a
      # given lockfile pays the download.
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: hf-${{ runner.os }}-

      # Pull requests measure and gate but never publish: branch results would race
      # into the committed file. See docs/adr/0001-generated-eval-results.md.
      - name: Retrieval quality gate
        env:
          PUBLISH_EVAL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: ./scripts/backend-eval.sh

      # The commit touches only frontend/data/** and docs/evaluation.md, neither of which
      # matches this workflow's path filters, so it cannot retrigger this job.
      - name: Publish measured results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/publish-results
        with:
          paths: frontend/data/evalResults.json docs/evaluation.md
          message: "chore(eval): publish retrieval results for"
          body: Generated by the Retrieval eval job. See docs/adr/0001-generated-eval-results.md.
          client-id: ${{ vars.EVAL_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.EVAL_PUBLISHER_PRIVATE_KEY }}
