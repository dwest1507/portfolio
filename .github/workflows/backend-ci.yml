name: Backend CI

# All check logic lives in scripts/ (shared with `make ci-cd`); jobs here only
# provision the environment and run the scripts.

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'docs/resume.txt'
      - 'docs/chatbot-questions.md'
      - 'frontend/content/projects/**'
      - 'scripts/backend-*.sh'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'docs/resume.txt'
      - 'docs/chatbot-questions.md'
      - 'frontend/content/projects/**'
      - 'scripts/backend-*.sh'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Lint checks
        run: ./scripts/backend-lint.sh

  test:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Tests
        run: ./scripts/backend-test.sh

  eval:
    name: Retrieval eval
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only this job writes; lint and test keep the workflow-level read-only default.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      # The embedding + cross-encoder weights are ~500MB. Cache them so only the
      # first run on a given lockfile pays the download.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: hf-${{ runner.os }}-

      # Pull requests measure and gate but never publish: branch results would race
      # into the committed file. See docs/adr/0001-generated-eval-results.md.
      - name: Retrieval quality gate
        env:
          PUBLISH_EVAL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: ./scripts/backend-eval.sh

      # The commit touches only frontend/data/** and docs/evaluation.md, neither of which
      # matches this workflow's path filters, so it cannot retrigger this job.
      - name: Publish measured results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- frontend/data/evalResults.json docs/evaluation.md; then
            echo "Results unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/evalResults.json docs/evaluation.md
          git commit -m "chore(eval): publish retrieval results for ${GITHUB_SHA:0:7}" \
            -m "Generated by the Retrieval eval job. See docs/adr/0001-generated-eval-results.md."
          # Rebase rather than force: another push may have landed while the eval ran.
          git pull --rebase origin main
          git push origin HEAD:main
