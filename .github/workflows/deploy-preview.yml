name: Preview Deploy

# Vercel preview deployment for every PR that touches the frontend.
# Deploy logic lives in scripts/deploy-frontend.sh (preview mode); this workflow
# adds the GitHub-only glue (PR comment). Skipped automatically for PRs from
# forks (secrets are unavailable there).

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/deploy-frontend.sh'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Vercel preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Previews are a convenience, not a correctness gate — skip politely until
      # the Vercel secrets exist (see docs/deployment.md). Production deploys in
      # deploy.yml stay strict and DO fail on missing secrets.
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Vercel preview — VERCEL_TOKEN secret is not configured yet (see docs/deployment.md)"
          fi

      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version-file: frontend/.nvmrc

      - name: Deploy preview
        if: steps.secrets.outputs.configured == 'true'
        id: deploy
        run: ./scripts/deploy-frontend.sh preview

      - name: Comment preview URL on PR
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview-url -->';
            const body = `${marker}\n🔍 **Vercel preview:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
