name: Deploy

# Deploy logic lives in scripts/deploy-frontend.sh and scripts/deploy-backend.sh
# (also runnable locally via `make deploy-frontend` / `make deploy-backend` with
# the same env vars). Deploys are intentionally NOT part of `make ci-cd` — they
# only run here, gated on the same CI scripts a local `make ci-cd` executes.

on:
  push:
    branches: [main]
  # Manual redeploy of both services (e.g. after changing env vars)
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at once; never cancel one mid-flight
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'scripts/frontend-*.sh'
              - 'scripts/deploy-frontend.sh'
              - '.github/workflows/frontend-ci.yml'
              - '.github/workflows/deploy.yml'
            backend:
              - 'backend/**'
              - 'scripts/backend-*.sh'
              - 'scripts/deploy-backend.sh'
              - '.github/workflows/backend-ci.yml'
              - '.github/workflows/deploy.yml'

  frontend-ci:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend-ci.yml

  backend-ci:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-ci.yml

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [changes, frontend-ci]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-frontend
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        id: deploy
        run: ./scripts/deploy-frontend.sh production

  deploy-backend:
    name: Deploy backend (Railway)
    needs: [changes, backend-ci]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-backend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        run: ./scripts/deploy-backend.sh
