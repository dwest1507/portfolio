version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # Covers backend/pyproject.toml, backend/uv.lock and backend/requirements.txt.
  # requirements.txt is a mirror of the pyproject constraints — keep the two in
  # sync so the scanned surface matches what uv.lock actually resolves.
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # Base image for the backend container (backend/Dockerfile)
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
