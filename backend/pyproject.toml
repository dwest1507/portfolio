[project]
name = "backend"
version = "1.5.0" # x-release-please-version
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# What the API actually needs to serve a request. Retrieval is BM25 over a pickled
# index, so nothing here is a machine-learning runtime.
dependencies = [
    "fastapi>=0.143.3",
    "groq>=1.7.0",
    "httpx>=0.27.0",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "slowapi>=0.1.9",
    "snowballstemmer>=3.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
# onnxruntime, tokenizers and huggingface-hub are here, not above, because the only code
# that reaches them is scripts/build_index.py and the evaluation harness. They run the
# embedding model and the cross-encoder for the Candidate Arms (app/rag/onnx_models.py)
# without torch, and stay here until one of those Arms is chosen to ship. The Dockerfile
# installs with --no-dev, so the production image carries neither them nor the model
# weights they download. app/rag/pipeline.py imports them lazily so the arms they
# implement stay measurable without returning to the serving path.
# The torch-based Reference Arms, and the sentence-transformers and faiss-cpu they needed,
# were retired once ONNX Runtime had reproduced them (ADR-0013).
dev = [
    "huggingface-hub>=1.28.0",
    "onnxruntime>=1.31.0",
    "ruff>=0.17.1",
    "tokenizers>=0.23.3",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "-m 'not live'"
markers = [
    "live: hits the real Groq API; deselected by default",
]

[tool.ruff]
line-length = 100
