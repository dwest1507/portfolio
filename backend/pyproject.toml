[project]
name = "backend"
version = "1.0.0" # x-release-please-version
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
# What the API actually needs to serve a request. Retrieval is BM25 over a pickled
# index, so nothing here is a machine-learning runtime.
dependencies = [
    "fastapi>=0.115.0",
    "groq>=1.7.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "slowapi>=0.1.9",
    "snowballstemmer>=3.1.1",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
# faiss-cpu and sentence-transformers are here, not above, because the only code that
# reaches them is scripts/build_index.py and the evaluation harness. The Dockerfile
# installs with --no-dev, so the production image carries neither them, nor the torch
# and CUDA wheels sentence-transformers pulls in, nor the ~500MB of model weights it
# downloads — 17.2GB of image down to 544MB. app/rag/pipeline.py imports both lazily so
# the arms they implement stay measurable without returning to the serving path.
dev = [
    "faiss-cpu>=1.9.0",
    "ruff>=0.16.5",
    "sentence-transformers>=6.0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "-m 'not live'"
markers = [
    "live: hits the real Groq API; deselected by default",
]

[tool.ruff]
line-length = 100
